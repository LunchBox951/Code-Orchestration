name: CI

on:
  push:
    branches: [main, dev, 'release/**']
  pull_request:
    branches: [main, dev, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm's version is read from package.json "packageManager" (pnpm@10.33.0).
      # No `version:` input on purpose: pnpm/action-setup@v6 throws
      # "Multiple versions of pnpm specified" when a `version` input disagrees
      # with the packageManager pin (e.g. `version: 10` != `pnpm@10.33.0`).
      # Deriving it from packageManager keeps a single source of truth and
      # installs exactly 10.33.0, matching the committed pnpm-lock.yaml.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm format:check

  stable-audit:
    name: stable-audit
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Stable promotion gets the stricter dependency gate. Nightly dependency
      # churn stays on dev, where Dependabot checks keep fixes flowing.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
