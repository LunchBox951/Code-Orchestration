name: Main merge policy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  require-dev-source:
    name: require-dev-source
    runs-on: ubuntu-latest
    steps:
      - name: Enforce dev to main only
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "base=${BASE_REF} head=${HEAD_REPO}:${HEAD_REF}"

          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" = "dev" ] && [ "$HEAD_REPO" = "$REPOSITORY" ]; then
            exit 0
          fi

          echo "PRs into main must come from this repository's dev branch."
          exit 1
