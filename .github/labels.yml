# Synced to GitHub by .github/workflows/label-sync.yml (Phase 5 wires the action).
# Format: EndBug/label-sync mapping entries (name / color / description).

# type
- name: "type:spec"
  color: "5319e7"
  description: "Top-level intent / locked spec"
- name: "type:phase"
  color: "8a63d2"
  description: "Independently-mergeable slice"
- name: "type:task"
  color: "b39ddb"
  description: "Implementer-sized unit"
- name: "type:bug"
  color: "d73a4a"
  description: "Something is broken"
- name: "type:research"
  color: "0e8a16"
  description: "Open, evidence-pending decision"

# role
- name: "role:coordinator"
  color: "1d76db"
  description: "Coordinator"
- name: "role:lead"
  color: "1d76db"
  description: "Lead"
- name: "role:implementer"
  color: "1d76db"
  description: "Implementer"
- name: "role:reviewer"
  color: "1d76db"
  description: "Reviewer"
- name: "role:researcher"
  color: "1d76db"
  description: "Researcher"

# status / lifecycle
- name: "status:spec-locked"
  color: "fbca04"
  description: "Spec locked, ready to plan"
- name: "status:in-phase"
  color: "fbca04"
  description: "Work in progress in a phase"
- name: "status:in-review"
  color: "fbca04"
  description: "At the review gate"
- name: "status:blocked"
  color: "e11d21"
  description: "Blocked / escalated"
- name: "status:done"
  color: "0e8a16"
  description: "Merged / complete"

# area
- name: "area:core"
  color: "c5def5"
  description: "packages/core"
- name: "area:cli"
  color: "c5def5"
  description: "packages/cli"
- name: "area:mcp"
  color: "c5def5"
  description: "packages/mcp"
- name: "area:desktop"
  color: "c5def5"
  description: "apps/desktop"
- name: "area:docs"
  color: "c5def5"
  description: "docs/"
- name: "area:meta"
  color: "c5def5"
  description: "repo tooling / governance"

# meta
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is welcome"
- name: "migration"
  color: "fef2c0"
  description: "Prototype-footprint teardown"
- name: "security:critical"
  color: "b60205"
  description: "Critical security promotion; permits skipping only the release soak gate"
