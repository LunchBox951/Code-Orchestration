version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: ci
