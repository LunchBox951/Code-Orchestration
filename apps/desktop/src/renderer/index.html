<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>co · Code Orchestration</title>
    <style>
      /* Design palette: dark oklch theme */
      :root {
        --bg: oklch(0.165 0.006 262);
        --surface: oklch(0.185 0.007 262);
        --card: oklch(0.205 0.007 262);
        --border: oklch(0.31 0.009 262);
        --text: oklch(0.83 0.006 262);
        --heading: oklch(0.96 0.003 262);
        --muted: oklch(0.65 0.009 262);
        --accent: oklch(0.71 0.14 255);
        --live: oklch(0.8 0.17 150);
        --header-h: 52px;
        --rail-w: 224px;
        --radius: 9px;
        font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
        font-size: 14px;
        color: var(--text);
        background: var(--bg);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* ── Header ─────────────────────────────────────────────── */
      header {
        height: var(--header-h);
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 12px;
        flex-shrink: 0;
        -webkit-app-region: drag;
      }

      .logo-tile {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-weight: 700;
        font-size: 16px;
        color: var(--accent);
        letter-spacing: -0.5px;
        -webkit-app-region: no-drag;
      }

      .header-title {
        font-size: 13px;
        color: var(--muted);
        flex: 1;
      }

      .live-pill {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 99px;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 11px;
        color: var(--muted);
        -webkit-app-region: no-drag;
      }

      .live-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--border);
        flex-shrink: 0;
        transition: background 0.3s;
      }

      .live-dot.live {
        background: var(--live);
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      .avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 600;
        color: #fff;
        flex-shrink: 0;
        -webkit-app-region: no-drag;
      }

      /* ── Body layout ─────────────────────────────────────────── */
      .body {
        flex: 1;
        display: flex;
        overflow: hidden;
      }

      /* ── Left rail ───────────────────────────────────────────── */
      nav {
        width: var(--rail-w);
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        padding: 8px 0;
      }

      .rail-title {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 4px 16px 8px;
      }

      .nav-item {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 16px;
        cursor: pointer;
        border-radius: 0;
        color: var(--muted);
        user-select: none;
        transition: color 0.15s;
        font-size: 13px;
      }

      .nav-item:hover {
        color: var(--text);
        background: var(--card);
      }

      .nav-item.active {
        color: var(--heading);
      }

      .nav-item.active::before {
        content: '';
        position: absolute;
        left: 0;
        top: 4px;
        bottom: 4px;
        width: 3px;
        background: var(--accent);
        border-radius: 0 3px 3px 0;
      }

      .nav-glyph {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 13px;
        width: 16px;
        text-align: center;
        flex-shrink: 0;
      }

      .nav-badge {
        margin-left: auto;
        background: var(--accent);
        color: #fff;
        font-size: 10px;
        font-weight: 600;
        padding: 1px 6px;
        border-radius: 99px;
        min-width: 18px;
        text-align: center;
      }

      /* ── Main panel ──────────────────────────────────────────── */
      main {
        flex: 1;
        overflow: auto;
        padding: 20px;
      }

      .view {
        display: none;
        height: 100%;
      }

      .view.active {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .view-heading {
        font-size: 18px;
        font-weight: 600;
        color: var(--heading);
      }

      .stub-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 40px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header>
      <span class="logo-tile">co</span>
      <span class="header-title">Code Orchestration · Conductor</span>
      <div class="live-pill">
        <span class="live-dot" id="live-dot"></span>
        <span id="live-label">offline</span>
      </div>
      <div class="avatar">OP</div>
    </header>

    <!-- Body -->
    <div class="body">
      <!-- Left rail nav -->
      <nav id="nav-rail">
        <div class="rail-title">Cockpit</div>
        <div class="nav-item active" data-view="dashboard">
          <span class="nav-glyph">◈</span>
          Dashboard
        </div>
        <div class="nav-item" data-view="agents">
          <span class="nav-glyph">⊕</span>
          Agents
        </div>
        <div class="nav-item" data-view="mail">
          <span class="nav-glyph">✉</span>
          Mail
          <span class="nav-badge" id="mail-badge" style="display: none">0</span>
        </div>
        <div class="nav-item" data-view="review">
          <span class="nav-glyph">◎</span>
          Review
        </div>
        <div class="nav-item" data-view="source">
          <span class="nav-glyph">⊞</span>
          Source
        </div>
        <div class="nav-item" data-view="cost">
          <span class="nav-glyph">§</span>
          Cost
        </div>
      </nav>

      <!-- Main content area -->
      <main>
        <div class="view active" id="view-dashboard">
          <div class="view-heading">Dashboard</div>
          <div class="stub-card">Loading conductor state…</div>
        </div>
        <div class="view" id="view-agents">
          <div class="view-heading">Agents</div>
          <div class="stub-card">Coming in a later stage.</div>
        </div>
        <div class="view" id="view-mail">
          <div class="view-heading">Mail</div>
          <div class="stub-card">Loading mail…</div>
        </div>
        <div class="view" id="view-review">
          <div class="view-heading">Review</div>
          <div class="stub-card">Coming in a later stage.</div>
        </div>
        <div class="view" id="view-source">
          <div class="view-heading">Source</div>
          <div class="stub-card">Coming in a later stage.</div>
        </div>
        <div class="view" id="view-cost">
          <div class="view-heading">Cost</div>
          <div class="stub-card">Loading cost data…</div>
        </div>
      </main>
    </div>
    <script src="../renderer/renderer.js"></script>
  </body>
</html>
